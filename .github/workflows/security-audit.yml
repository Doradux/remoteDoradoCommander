name: Dependency security audit

on:
  push:
    branches: [main, feature/commercial-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install latest audited pip and application dependencies
        run: |
          python -m pip install --upgrade pip==26.3
          python -m pip install . pip-audit
      - name: Check Python dependency advisory database
        run: python -m pip_audit --progress-spinner off

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Check production frontend dependency advisory database
        run: npm audit --prefix frontend --omit=dev --audit-level=high
