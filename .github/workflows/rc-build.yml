name: Cross-platform RC binaries (no release, no publish)

on:
  push:
    branches: [feature/commercial-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: windows-x64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.platform == 'linux-x64'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Animate UI for standalone Linux relay
        if: matrix.platform == 'linux-x64'
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
          git diff --exit-code -- remote_dorado/static
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clear personalized relay configuration
        run: python scripts/set_build_relay.py
      - name: Install packaging dependencies
        run: python -m pip install . "pyinstaller>=6.10,<7"
      - name: Build agent binary
        run: python -m PyInstaller --noconfirm --clean --onefile --name remote-dorado-agent --collect-all websockets scripts/agent_entry.py
      - name: Smoke test standalone agent without credentials
        run: python -c "import pathlib,subprocess,sys; p=(pathlib.Path('dist')/('remote-dorado-agent.exe' if sys.platform=='win32' else 'remote-dorado-agent')).resolve(); r=subprocess.run([str(p),'--help'],capture_output=True,text=True,timeout=35); print(r.stdout); assert r.returncode==0 and '--permission' in r.stdout and '--read-only' in r.stdout"
      - name: Package agent
        run: python scripts/package_release.py --platform ${{ matrix.platform }} --component agent
      - name: Build standalone Linux server
        if: matrix.platform == 'linux-x64'
        run: python -m PyInstaller --noconfirm --clean --onefile --name remote-dorado-server --collect-all uvicorn --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all multipart --collect-all websockets --collect-all anyio --collect-data remote_dorado scripts/server_entry.py
      - name: Verify standalone server UI, license and no unintended launch
        if: matrix.platform == 'linux-x64'
        run: python -c "import pathlib,subprocess; p=pathlib.Path('dist/remote-dorado-server').resolve(); r=subprocess.run([str(p),'--check-assets'],capture_output=True,text=True,timeout=40); print(r.stdout,r.stderr); assert r.returncode==0 and 'assets and license: OK' in r.stdout"
      - name: Package Linux server
        if: matrix.platform == 'linux-x64'
        run: python scripts/package_release.py --platform linux-x64 --component server
      - uses: actions/upload-artifact@v4
        with:
          name: dorado-rc-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
