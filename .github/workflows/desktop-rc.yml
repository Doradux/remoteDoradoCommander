name: Desktop RC Windows and Ubuntu — private candidate artifacts

on:
  push:
    branches: [feature/commercial-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: ubuntu-x64
          - runner: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Qt runtime libraries on Ubuntu
        if: matrix.platform == 'ubuntu-x64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libglib2.0-0 libgssapi-krb5-2 libkrb5-3 libfreetype6 libfontconfig1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Install the native desktop requirements and PyInstaller
        run: python -m pip install ".[desktop-test]" "pyinstaller>=6.10,<7"
      - name: Embed only the public official Cloud URL when available
        env:
          DORADO_BUILD_CLOUD_URL: ${{ vars.DORADO_CLOUD_API_URL }}
        run: python scripts/set_build_relay.py
      - name: Test native GUI, saved identity and Cloud contract without network
        run: python -m pytest -q tests/test_desktop_gui.py tests/test_desktop_state.py tests/test_desktop_cloud_client.py
      - name: Native UI render without requiring a server or real account
        run: python scripts/desktop_entry.py --smoke-test
      - name: Build real GUI executable for this operating system
        run: python scripts/build_desktop.py
      - name: Verify packaged GUI executable starts and exits cleanly
        run: |
          python -c "import os,pathlib,subprocess,sys; executable=(pathlib.Path('dist/DoradoRelay')/('DoradoRelay.exe' if sys.platform=='win32' else 'DoradoRelay')).resolve(); p=subprocess.run([str(executable),'--smoke-test'],env={**os.environ,'QT_QPA_PLATFORM':'offscreen'},capture_output=True,timeout=50); print('Qt executable smoke exit:',p.returncode); assert p.returncode==0"
      - name: Bundle third-party notices and portable app directory
        run: python scripts/package_desktop.py --platform ${{ matrix.platform }}
      - name: Share private candidate with project owner (NOT GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: dorado-desktop-candidate-${{ matrix.platform }}
          path: desktop-artifacts/*
          if-no-files-found: error
          retention-days: 14
