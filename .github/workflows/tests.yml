name: Python and Animate UI tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Animate UI frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Smoke-test all React views without launching a browser
        run: npm run test:ssr --prefix frontend
      - name: Build official Animate UI production assets
        run: npm run build --prefix frontend
      - name: Verify bundled React assets match committed source
        run: git diff --exit-code -- remote_dorado/static
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
