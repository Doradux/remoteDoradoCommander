[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-dorado-commander"
version = "0.3.0"
description = "Self-hosted remote computer MCP server and outbound device agent"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "httpx>=0.27,<1", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
remote-dorado-server = "remote_dorado.server:main"
remote-dorado-agent = "remote_dorado.agent:main"

[tool.setuptools.packages.find]
include = ["remote_dorado*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
